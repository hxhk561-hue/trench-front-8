<script>
const W=180,H=320,$=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;
const PAL={k:'#14141f',g:'#9aa0a6',s:'#f1c27d',w:'#f4f1de'},TEAM=[{a:'#3b82f6',d:'#1e3a8a'},{a:'#ef4444',d:'#7f1d1d'}];
const SP={

const T={inf:{n:'ทหารราบ',c:10,hp:30,sp:14,r:28,d:5,cd:.6},tank:{n:'รถถัง',c:40,hp:220,sp:10,r:42,d:70,cd:1.6},
arty:{n:'ปืนใหญ่',c:35,hp:40,sp:5,r:100,d:20,cd:2},drone:{n:'โดรน',c:20,hp:15,sp:38,r:8,d:45,cd:.1},aa:{n:'ต้านโดรน',c:20,hp:40,sp:12,r:45,d:12,cd:.5},kaiju:{n:'ไคจู',c:120,hp:450,sp:9,r:16,d:40,cd:1.1}};

let AC=null,mute=false,lastS=0;
function snd(f,d,ty,v,sl){if(mute)return;const nw=performance.now();if(nw-lastS<45)return;lastS=nw;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,sl),t0+d);gn.gain.setValueAtTime(v||.05,t0);gn.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(t0+d)}catch(e){}}
let AX=null,MG=null,NB=null;const LS={};
function ax(){if(!AX){AX=new(window.AudioContext||window.webkitAudioContext)();const c=AX.createDynamicsCompressor();MG=AX.createGain();MG.gain.value=.9;MG.connect(c);c.connect(AX.destination);const n=AX.sampleRate*2,b=AX.createBuffer(1,n,AX.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;NB=b}if(AX.state==='suspended')AX.resume()}
function nz(dur,f0,f1,ty,q,v){const t=AX.currentTime,s=AX.createBufferSource(),f=AX.createBiquadFilter(),gn=AX.createGain();s.buffer=NB;f.type=ty;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(gn);gn.connect(MG);s.start(t,Math.random()*.5);s.stop(t+dur)}
function tn(f0,f1,dur,v,ty){const t=AX.currentTime,o=AX.createOscillator(),gn=AX.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(MG);o.start(t);o.stop(t+dur)}
function sfx(k){if(mute)return;try{ax();const n=performance.now(),lim={rifle:70,aa:70,cannon:100}[k]||90;if(LS[k]&&n-LS[k]<lim)return;LS[k]=n;
if(k==='rifle'){nz(.09,3200,900,'bandpass',.8,.35);tn(180,60,.06,.2,'triangle')}
else if(k==='aa'){nz(.06,4200,1500,'bandpass',1,.28);tn(260,90,.05,.15,'square')}
else if(k==='cannon'){nz(.45,1400,80,'lowpass',.7,.9);tn(110,35,.4,.8,'sine')}
else if(k==='shell'){nz(.9,1800,60,'lowpass',.6,1);tn(70,25,.8,.9,'sine')}
else if(k==='drone'){nz(.7,2200,70,'lowpass',.6,.95);tn(90,28,.6,.8,'sine')}
else if(k==='whoosh'){nz(.7,300,2500,'bandpass',1.2,.3);tn(70,25,.7,.7,'sine')}
else if(k==='meow'){tn(500,900,.15,.2,'triangle');tn(900,400,.25,.15,'triangle')}
else if(k==='buy')tn(520,780,.09,.12,'square');
else if(k==='win')tn(440,880,.5,.2,'triangle');
else tn(160,40,.8,.3,'sawtooth')}catch(e){}}
function genOb(){const a=[],n=5+Math.min(LV,5);let tr=0;while(a.length<n&&tr++<80){const w=18+Math.floor(Math.random()*10),b={x:10+Math.random()*(W-20-w),y:70+Math.random()*180,w,h:6};if(a.some(o=>Math.abs(o.x-b.x)<34&&Math.abs(o.y-b.y)<22))continue;a.push(b)}return a}
function blocked(a,b){for(let i=1;i<=10;i++){const x=a.x+(b.x-a.x)*i/11,y=a.y+(b.y-a.y)*i/11;for(const o of OB)if(x>o.x&&x<o.x+o.w&&y>o.y-1&&y<o.y+o.h+1)return true}return false}
const cache={};
function spr(t,tm){const k=t+tm;if(cache[k])return cache[k];const rows=SP[t],h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
rows.forEach((r,j)=>{const y=tm?h-1-j:j;for(let i=0;i<w;i++){const ch=r[i];if(ch==='.')continue;x.fillStyle=ch==='a'?TEAM[tm].a:ch==='d'?TEAM[tm].d:PAL[ch];x.fillRect(i,y,1,1)}});return cache[k]=c}
// background
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const x=bg.getContext('2d');let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;
const gr=['#4f6b3a','#587545','#46603a'];
for(let y=0;y<H;y+=2)for(let i=0;i<W;i+=2){x.fillStyle=gr[Math.floor(R()*3)];x.fillRect(i,y,2,2)}
x.fillStyle='#6b5638';x.fillRect(0,148,W,24);
for(let i=0;i<W;i+=2){x.fillStyle=R()<.5?'#5a4930':'#7a6240';x.fillRect(i,148+Math.floor(R()*24),2,2)}
x.fillStyle='#3b2e1c';for(let i=0;i<W;i+=12){x.fillRect(i,156+((i/12)%2)*4,8,3)}
for(let n=0;n<9;n++){const cx=10+R()*160,cy=60+R()*200;if(cy>140&&cy<180)continue;x.fillStyle='#3a3a2a';x.fillRect(cx-4,cy-2,8,4);x.fillRect(cx-2,cy-4,4,8)}
x.fillStyle='#8a7a55';for(let i=8;i<W-8;i+=10){x.fillRect(i,34,7,3);x.fillRect(i,H-37,7,3)}})();
let units,fx,pm,em,pb,eb,time,ai,state='start',LV=1,sk=0,armed=false,OB=[],sk2=0,role=0,rm=null,UID=0,psum=0,snT=0,hiT=0,iL=0,iL2=0,CR='',frT=0,land=false;
function reset(){units=[];fx=[];pm=60+(LV-1)*20;em=60;time=0;ai=2;sk=0;sk2=0;iL=0;iL2=0;armed=false;document.querySelectorAll('.arm').forEach(e=>e.classList.remove('arm'));pb={x:90,y:302,hp:300,max:300};const eh=300+(LV-1)*60;eb={x:90,y:18,hp:eh,max:eh};OB=genOb()}
reset();
const cnt=tm=>units.filter(u=>u.tm===tm).length;
function spawn(t,tm){units.push({id:++UID,t,tm,x:15+Math.random()*150,y:tm?44:H-44,hp:T[t].hp,cd:Math.random()*.5})}
function buy(t){if(role===2){if(state==='play'&&rm&&em>=T[t].c){rm.emit('cmd',{k:'buy',t}).catch(()=>{});em-=T[t].c;sfx('buy')}return}if(state!=='play')return;if(pm>=T[t].c&&cnt(0)<30){pm-=T[t].c;spawn(t,0);sfx('buy')}}
function aiBuy(){if(cnt(1)>=30)return;const mine={};units.forEach(u=>{if(u.tm===0)mine[u.t]=(mine[u.t]||0)+1});
let top=null,mx=0;for(const k in mine)if(mine[k]>mx){mx=mine[k];top=k}
let pick=top&&Math.random()<.5?CTR[top]:null;
if(!pick||T[pick].c>em){const a=ORD.filter(k=>T[k].c<=em);if(!a.length)return;pick=a[Math.floor(Math.random()*a.length)]}
em-=T[pick].c;spawn(pick,1)}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function update(dt){time+=dt;const cap=250+(LV-1)*25;pm=Math.min(cap,pm+(9+(LV-1)*.8+iL*4)*dt);if(role===1)em=Math.min(cap,em+(9+iL2*4)*dt);else em+=(8+time*.02+(LV-1))*dt;sk=Math.max(0,sk-dt);sk2=Math.max(0,sk2-dt);ai-=dt;if(role!==1&&ai<=0){ai=1.2+Math.random()*1.2;aiBuy()}
for(const u of units){if(u.hp<=0)continue;const tp=T[u.t],mi=M[u.t];u.cd-=dt;
let best=null,bd=1e9,near=null,nd=70;
for(const o of units){if(o.tm===u.tm||o.hp<=0||mi[ORD.indexOf(o.t)]<=0)continue;const d=dist(u,o);
if(d<=tp.r&&(u.t!=='arty'||d>=25)&&d<bd){bd=d;best=o}if(d<nd){nd=d;near=o}}
const eb2=u.tm?pb:eb;let tgt=best,isBase=false;
if(!tgt&&Math.abs(u.y-eb2.y)<=tp.r+6){tgt=eb2;isBase=true}
if(tgt){if(u.cd<=0){u.cd=tp.cd;let dmg=isBase?tp.d*(u.t==='tank'?.35:1):tp.d*mi[ORD.indexOf(tgt.t)];if(!isBase&&u.t!=='arty'&&u.t!=='drone'&&blocked(u,tgt))dmg*=.5;tgt.hp-=dmg;if(u.t==='kaiju'&&!isBase)for(const o of units){if(o!==tgt&&o.tm!==u.tm&&o.hp>0&&o.t!=='drone'&&dist(o,tgt)<18){o.hp-=dmg*.5;if(o.hp<=0){if(u.tm===0)pm+=T[o.t].c*.5;else em+=T[o.t].c*.5}}}
fx.push({x1:u.x,y1:u.y,x2:tgt.x,y2:tgt.y,l:.12,t:u.t});
if(u.t==='drone'||u.t==='arty'){fx.push({x:tgt.x,y:tgt.y,l:.25,e:1});sfx(u.t==='drone'?'drone':'shell')}else{sfx(u.t==='tank'||u.t==='kaiju'?'cannon':u.t==='aa'?'aa':'rifle');if(u.t==='kaiju')sfx('meow');if(u.t==='tank'||u.t==='kaiju')fx.push({x:tgt.x,y:tgt.y,l:.2,e:1})}
if(u.t==='drone')u.hp=0;
if(!isBase&&tgt.hp<=0){if(u.tm===0)pm+=T[tgt.t].c*.5;else em+=T[tgt.t].c*.5}}}
else{let dx=0,dy=u.tm?1:-1;if(near){dx=near.x-u.x;dy=near.y-u.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l}
if(u.tm===1&&near&&(u.t==='inf'||u.t==='aa')&&(u.w=u.w||0)<6){let bo=null,bd2=60;for(const o of OB){const d=Math.hypot(o.x+o.w/2-u.x,o.y+o.h/2-u.y);if(d<bd2){bd2=d;bo=o}}
if(bo){u.w+=dt;if(blocked(near,u)){dx=0;dy=0}else{const cx=bo.x+bo.w/2,cy=bo.y+bo.h/2,ex=cx-near.x,ey=cy-near.y,el=Math.hypot(ex,ey)||1;dx=cx+ex/el*9-u.x;dy=cy+ey/el*9-u.y;const l=Math.hypot(dx,dy)||1;if(l>2){dx/=l;dy/=l}else{dx=0;dy=0}}}}
u.x+=dx*tp.sp*dt;u.y+=dy*tp.sp*dt}
for(const o of units){if(o===u||o.tm!==u.tm||o.hp<=0)continue;const d=dist(u,o);if(d<6&&d>0){u.x+=(u.x-o.x)/d*8*dt;u.y+=(u.y-o.y)/d*8*dt}}
if(u.t!=='drone')for(const o of OB){const l=o.x-4,r=o.x+o.w+4,t=o.y-4,bt=o.y+o.h+4;if(u.x>l&&u.x<r&&u.y>t&&u.y<bt){const px=Math.min(u.x-l,r-u.x),py=Math.min(u.y-t,bt-u.y);if(px<py)u.x+=u.x<o.x+o.w/2?-px:px;else{u.y+=u.y<o.y+o.h/2?-py:py;u.x+=(u.x<o.x+o.w/2?-1:1)*tp.sp*dt*1.5}}}
u.x=Math.max(6,Math.min(W-6,u.x));u.y=Math.max(30,Math.min(H-30,u.y))}
units=units.filter(u=>u.hp>0);fx.forEach(f=>f.l-=dt);fx=fx.filter(f=>f.l>0);
if(eb.hp<=0)role?endNet(1):end(1);else if(pb.hp<=0)role?endNet(0):end(0)}
function end(w){state='over';sfx(w?'win':'lose');let best=0;try{best=+localStorage.getItem('tf')||0}catch(e){}
if(w){LV++;best=Math.max(best,LV-1);try{localStorage.setItem('tf',best)}catch(e){}}
show(w?'ชนะแล้ว!':'ฐานแตก',w?'ด่านถัดไป ฐานศัตรูอึดขึ้นและรวยขึ้น':'ลองวางหน่วยให้ตรงกับศัตรู หรือใช้จรวดช่วย','ผ่านสูงสุด: ด่าน '+best+' · แตะเพื่อ'+(w?'ไปต่อ':'เล่นใหม่'))}
function base(b,tm){g.fillStyle=TEAM[tm].d;g.fillRect(b.x-30,b.y-8,60,16);g.fillStyle=TEAM[tm].a;g.fillRect(b.x-30,b.y-8,60,4);g.fillStyle='#14141f';g.fillRect(b.x-6,b.y-4,12,12);
g.fillStyle='#9aa0a6';g.fillRect(b.x-2,tm?b.y+8:b.y-14,4,6);
const by=tm?b.y+12:b.y-14;g.fillStyle='#14141f';g.fillRect(b.x-29,by-1,58,5);g.fillStyle=TEAM[tm].a;g.fillRect(b.x-28,by,Math.max(0,56*b.hp/b.max),3)}
function draw(){g.save();g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);if(land)g.setTransform(...(role===2?[0,-1,1,0,0,W]:[0,1,-1,0,H,0]));else if(role===2)g.setTransform(-1,0,0,-1,W,H);g.drawImage(bg,0,0);OB.forEach(b=>{g.fillStyle='#5e5238';g.fillRect(b.x,b.y+2,b.w,b.h-1);g.fillStyle='#a89968';g.fillRect(b.x,b.y,b.w,b.h-2);g.fillStyle='#5e5238';for(let i=6;i<b.w;i+=6)g.fillRect(b.x+i,b.y,1,b.h-2)});base(eb,1);base(pb,0);
[...units].sort((a,b)=>a.y-b.y).forEach(u=>{const s=spr(u.t,u.tm),x=Math.round(u.x-s.width/2),y=Math.round(u.y-s.height/2);g.drawImage(s,x,y);
if(u.hp<T[u.t].hp){g.fillStyle='#14141f';g.fillRect(x,y-3,s.width,2);g.fillStyle='#7bd88f';g.fillRect(x,y-3,Math.ceil(s.width*u.hp/T[u.t].hp),2)}});
for(const f of fx){if(f.e){g.fillStyle=f.l>.12?'#f2c14e':'#ef7b3a';const r=f.l>.12?3:5;g.fillRect(Math.round(f.x)-r,Math.round(f.y)-r,r*2,r*2)}
else if(f.t!=='arty'&&f.t!=='drone'){g.strokeStyle='#f2c14e';g.lineWidth=1;g.beginPath();g.moveTo(Math.round(f.x1)+.5,Math.round(f.y1)+.5);g.lineTo(Math.round(f.x2)+.5,Math.round(f.y2)+.5);g.stroke()}}g.restore()}

const bar=$('bar'),btns={};
